name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      # Every distribution, the setuptools build backend included, comes from the
      # hash-locked file; the package then installs without resolving anything.
      # Regenerate the lock with the command in requirements/ci/test.in.
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/ci/test.txt
      - name: Install the package (no dependency resolution, clean environment)
        run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Check installed requirements are consistent
        run: python -m pip check
      - name: Lint
        run: ruff check src tests --no-cache
      - name: Fixtures are reproducible from the generator
        run: |
          python -c "from pathlib import Path; from szl_evidence.fixturegen import build_all; build_all(Path('fixtures'))"
          git diff --exit-code -- fixtures
      - name: Tests
        run: python -m pytest -q
      - name: Engine exit codes (valid=0, empty=2, narrated=2)
        shell: bash
        run: |
          set +e  # collect each exit code; the final test asserts all three
          szl-audit engine verify fixtures/valid --quiet; a=$?
          szl-audit engine verify fixtures/empty-input --quiet; b=$?
          szl-audit engine verify fixtures/narrated-verification --quiet; c=$?
          test "$a$b$c" = "022"
      - name: Mutation testing (blind spots are printed, never suppressed)
        run: szl-audit engine mutate fixtures/valid
