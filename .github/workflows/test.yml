name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install (clean environment)
        run: python -m pip install -e ".[dev,sign]"
      - name: Lint
        run: ruff check src tests --no-cache
      - name: Fixtures are reproducible from the generator
        run: |
          python -c "from pathlib import Path; from szl_evidence.fixturegen import build_all; build_all(Path('fixtures'))"
          git diff --exit-code -- fixtures
      - name: Tests
        run: python -m pytest -q
      - name: Engine exit codes (valid=0, empty=2, narrated=2)
        shell: bash
        run: |
          set +e
          szl-audit engine verify fixtures/valid --quiet; a=$?
          szl-audit engine verify fixtures/empty-input --quiet; b=$?
          szl-audit engine verify fixtures/narrated-verification --quiet; c=$?
          test "$a$b$c" = "022"
      - name: Mutation testing (blind spots are printed, never suppressed)
        run: szl-audit engine mutate fixtures/valid
