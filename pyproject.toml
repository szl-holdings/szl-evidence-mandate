[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-evidence-mandate"
version = "0.1.2"
description = "Scientific Evidence Gate engine plus evidence-backed estate audits (GitHub + Hugging Face)."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
sign = ["cryptography>=42"]
openislet = ["numpy>=2.0,<3"]
# Everything the full test suite imports: pytest plus the sign and openislet extras
# (same specifiers; tests/test_ci_requirements.py keeps them in step).
test = ["pytest>=8", "cryptography>=42", "numpy>=2.0,<3"]

[project.scripts]
szl-audit = "szl_evidence.cli:main"

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-evidence-mandate"
Source = "https://github.com/szl-holdings/szl-evidence-mandate"
Issues = "https://github.com/szl-holdings/szl-evidence-mandate/issues"
Changelog = "https://github.com/szl-holdings/szl-evidence-mandate/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"szl_evidence.openislet" = ["static/*", "vendor/*.txt", "vendor/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S602", "S604", "S605", "S301", "S506"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Preserve the cryptographically pinned upstream function bytes; iteration is
# returned after the loop, and is intentionally not renamed in the excerpt.
"src/szl_evidence/openislet/vendor/peroxide.py" = ["B007"]

[tool.szl.release]
import_names = ["szl_evidence"] # wheel top-level import names; the release gate fails if the built wheel differs
